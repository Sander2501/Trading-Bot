[project]
name = "trading-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sseclient-py>=1.7",
    "websockets>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 line-too-long: long log format strings are intentional
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
