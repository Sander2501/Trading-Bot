[project]
name = "trading-bot"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 line-too-long: long log format strings are intentional
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
